<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22DB80"/>
      <stop offset="100%" stop-color="#00B7FF"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22DB80"/>
      <stop offset="100%" stop-color="#00B7FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (iOS-style ~22% radius) -->
  <rect width="512" height="512" rx="114" ry="114" fill="url(#bg)"/>
  <!-- Subtle green tint overlay -->
  <rect width="512" height="512" rx="114" ry="114" fill="#22DB80" opacity="0.05"/>

  <!-- Orbital system centered at 256,256 -->
  <g transform="translate(256,256)">
    <!-- Outer orbit ring -->
    <ellipse cx="0" cy="0" rx="165" ry="62" fill="none"
             stroke="url(#orbit)" stroke-width="7" opacity="0.65"
             transform="rotate(-22)"/>
    <!-- Inner orbit ring -->
    <ellipse cx="0" cy="0" rx="116" ry="43" fill="none"
             stroke="url(#orbit)" stroke-width="4.5" opacity="0.32"
             transform="rotate(28)"/>

    <!-- Orbiting dots — outer ring -->
    <g transform="rotate(-22)">
      <circle cx="160" cy="-55" r="17" fill="#22DB80"/>
      <circle cx="-154" cy="51"  r="14" fill="#00B7FF"/>
    </g>
    <!-- Orbiting dot — inner ring -->
    <g transform="rotate(28)">
      <circle cx="110" cy="37" r="11" fill="#22DB80" opacity="0.88"/>
    </g>

    <!-- Core halo -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#22DB80" stroke-width="2.5" opacity="0.30"/>
    <!-- Core gradient circle -->
    <circle cx="0" cy="0" r="46" fill="url(#core)"/>
  </g>
</svg>
